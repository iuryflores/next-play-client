<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111018" />
    <script>
      // Antes de consultar a sessão, acompanha o dispositivo sem ler preferências locais.
      (() => {
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#191621' : '#f5f3f9';
      })();
    </script>
    <meta name="description" content="Seu espaço para acompanhar filmes, séries, jogos e livros. Qual é a sua próxima história?" />
    <link rel="icon" type="image/svg+xml" href="/nextplay-symbol.svg" />
    <title>Entrar · NextPlay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
